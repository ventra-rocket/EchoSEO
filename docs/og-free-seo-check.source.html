<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "IBM Plex Sans";
    src: local("IBM Plex Sans");
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1200px;
    height: 630px;
  }
  body {
    background: #0b0f14;
    color: #e6eaf0;
    font-family:
      "IBM Plex Sans",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    padding: 76px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    inset: -30% -10% auto auto;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(25, 227, 177, 0.16) 0%,
      rgba(25, 227, 177, 0) 62%
    );
  }
  .top {
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
  }
  .word {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: 78px;
    line-height: 1.06;
    font-weight: 700;
    letter-spacing: -0.035em;
    max-width: 15ch;
    position: relative;
  }
  h1 em,
  .sub em {
    font-style: normal;
    color: #19e3b1;
    font-weight: 500;
  }
  .sub {
    font-size: 30px;
    line-height: 1.35;
    color: #9aa6b5;
    max-width: 30ch;
    margin-top: 24px;
    position: relative;
  }
  .foot {
    display: flex;
    gap: 14px;
    align-items: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 21px;
    color: #6f7f92;
    position: relative;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #19e3b1;
  }
</style>
<div class="glow"></div>
<div class="top">
  <svg width="64" height="64" viewBox="0 0 96 96">
    <rect width="96" height="96" rx="20" fill="#0B0F14" />
    <g
      fill="none"
      stroke-linecap="round"
      transform="translate(20 8) skewX(-10)"
    >
      <path d="M22 34 A13 13 0 0 1 22 52" stroke="#F5A524" stroke-width="5" />
      <path d="M34 25 A25 25 0 0 1 34 61" stroke="#19E3B1" stroke-width="6.5" />
      <path
        d="M48 16 A36 36 0 0 1 48 70"
        stroke="#19E3B1"
        stroke-width="8"
        opacity=".82"
      />
    </g>
  </svg>
  <span class="word">EchoSEO</span>
</div>
<div>
  <h1>Free SEO Checker</h1>
  <p class="sub">
    Every fix cited to <em>Google's own documentation</em> — not a guess.
  </p>
</div>
<div class="foot">
  <span class="dot"></span>
  <span>echoseo.ventrarocket.vn</span>
  <span>·</span>
  <span>no signup</span>
</div>
