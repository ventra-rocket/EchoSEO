services:
  open-seo:
    # Published by .github/workflows/docker-image.yml from this repo. Override
    # with ECHOSEO_IMAGE to run a locally built or pinned tag.
    image: ${ECHOSEO_IMAGE:-ghcr.io/ventra-rocket/echoseo:latest}
    restart: unless-stopped
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # Optional: the in-app AI features (onboarding chat, assistant workspace,
      # audit issue explainer). Without these the setup gate in the app asks for
      # a key, but nothing here would forward one.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_EXPLAINER_MODEL=${OPENROUTER_EXPLAINER_MODEL:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
volumes:
  open_seo_data:
