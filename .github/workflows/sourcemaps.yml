name: Upload sourcemaps
on:
  push:
    branches:
      - main
concurrency:
  group: sourcemaps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upload:
    if: github.repository != 'every-app/open-seo'
    runs-on: ubuntu-latest
    env:
      POSTHOG_SOURCEMAPS: "true"
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
      POSTHOG_CLI_ENV_ID: ${{ vars.POSTHOG_CLI_ENV_ID }}
      POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Uploading needs a PostHog token that only this project's own repository
      # has. A fork, a contributor's pull request, or this repository before the
      # token is configured has nothing to upload with, and failing there would
      # report broken code when nothing is broken. Skip instead.
      - name: Install dependencies
        if: env.POSTHOG_CLI_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Build and upload sourcemaps
        if: env.POSTHOG_CLI_TOKEN != ''
        run: pnpm run sourcemaps:upload
